<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Launching Patient Portal</title>
  <style>
    :root {
      --bg0:#060b16;
      --bg1:#0d1730;
      --bg2:#14264b;
      --brand:#2a66ff;
      --brand2:#20d4ff;
      --text:#e9f3ff;
      --muted:#a7bdd7;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 10% 10%, rgba(42,102,255,.25), transparent 65%),
        radial-gradient(700px 400px at 90% 80%, rgba(32,212,255,.18), transparent 60%),
        linear-gradient(145deg, var(--bg0), var(--bg1) 48%, var(--bg2));
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: radial-gradient(circle at center, rgba(0,0,0,.95), transparent 78%);
      animation: pulse 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    .panel {
      width: min(760px, calc(100% - 32px));
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 18px;
      background: linear-gradient(160deg, rgba(15,25,49,.8), rgba(9,16,34,.72));
      box-shadow: 0 28px 70px rgba(0,0,0,.5), inset 0 0 30px rgba(42,102,255,.16);
      backdrop-filter: blur(8px);
      padding: 36px 28px 30px;
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: -150% -50% auto;
      height: 120px;
      background: linear-gradient(90deg, transparent, rgba(32,212,255,.35), transparent);
      transform: rotate(-8deg);
      animation: sweep 2.2s linear infinite;
    }

    .eyebrow {
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--brand2);
      font-size: .75rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      letter-spacing: -.02em;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.5;
    }

    .status {
      margin-top: 22px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: .94rem;
    }

    .bar {
      margin-top: 8px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.18);
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--brand), var(--brand2));
      box-shadow: 0 0 14px rgba(32,212,255,.8);
      animation: load 2.2s ease-out forwards;
    }

    .actions {
      margin-top: 22px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      border-radius: 10px;
      text-decoration: none;
      padding: 10px 14px;
      font-weight: 700;
      font-size: .9rem;
      border: 1px solid rgba(255,255,255,.3);
      color: var(--text);
      background: rgba(255,255,255,.08);
    }

    .btn.primary {
      border: none;
      background: linear-gradient(135deg, var(--brand), #4f8cff);
    }

    @keyframes load { to { width: 100%; } }
    @keyframes sweep {
      from { transform: translateX(-20%) rotate(-8deg); }
      to { transform: translateX(120%) rotate(-8deg); }
    }
    @keyframes pulse {
      0%,100% { opacity: .35; }
      50% { opacity: .6; }
    }
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>

  <main class="panel" role="main" aria-live="polite">
    <div class="eyebrow">Ubuntu United Health Network</div>
    <h1>Secure Patient Portal Initializing</h1>
    <p class="subtitle">
      Establishing encrypted session and loading your registration workspace.
      You will be redirected automatically.
    </p>

    <div class="status">
      <span>System Status: Online</span>
      <span id="countdown">Redirecting in 3s…</span>
    </div>
    <div class="bar"><span></span></div>

    <div class="actions">
      <a class="btn primary" href="patient-form3.html">Open Portal Now</a>
      <a class="btn" href="terms3.html">View Terms & Privacy</a>
    </div>
  </main>

  <script>
    const countdownEl = document.getElementById('countdown');
    let remaining = 3;

    const interval = setInterval(() => {
      remaining -= 1;
      if (remaining > 0) {
        countdownEl.textContent = `Redirecting in ${remaining}s…`;
        return;
      }

      clearInterval(interval);
      countdownEl.textContent = 'Redirecting now…';
      window.location.href = 'patient-form3.html';
    }, 1000);
  </script>
</body>
</html>
